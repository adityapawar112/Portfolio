<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Ears top & outer border -->
  <rect x="2" y="1" width="4" height="1" fill="#bdfa2f" />
  <rect x="10" y="1" width="4" height="1" fill="#bdfa2f" />
  <rect x="2" y="2" width="1" height="2" fill="#bdfa2f" />
  <rect x="13" y="2" width="1" height="2" fill="#bdfa2f" />

  <!-- Ears fill -->
  <rect x="3" y="2" width="3" height="2" fill="#97d841" />
  <rect x="10" y="2" width="3" height="2" fill="#97d841" />

  <!-- Head frame & border -->
  <rect x="6" y="4" width="4" height="1" fill="#bdfa2f" />
  <rect x="2" y="4" width="1" height="9" fill="#bdfa2f" />
  <rect x="13" y="4" width="1" height="9" fill="#bdfa2f" />
  <rect x="2" y="12" width="12" height="1" fill="#bdfa2f" />

  <!-- Bottom shadow -->
  <rect x="2" y="13" width="12" height="1" fill="#071817" />

  <!-- Face fill -->
  <rect x="3" y="4" width="3" height="1" fill="#97d841" />
  <rect x="10" y="4" width="3" height="1" fill="#97d841" />
  <rect x="3" y="5" width="10" height="2" fill="#97d841" />
  <rect x="3" y="7" width="2" height="3" fill="#97d841" />
  <rect x="7" y="7" width="2" height="3" fill="#97d841" />
  <rect x="11" y="7" width="2" height="3" fill="#97d841" />
  <rect x="3" y="10" width="4" height="1" fill="#97d841" />
  <rect x="9" y="10" width="4" height="1" fill="#97d841" />
  <rect x="3" y="11" width="10" height="1" fill="#97d841" />

  <!-- Eyes -->
  <rect x="5" y="7" width="2" height="3" fill="#071817" />
  <rect x="9" y="7" width="2" height="3" fill="#071817" />

  <!-- Nose -->
  <rect x="7" y="10" width="2" height="1" fill="#bdfa2f" />
</svg>